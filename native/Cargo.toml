[package]
name = "snow_native"
version = "0.1.15"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-openai = { version = "0.30.1", features = ["byot"] }
chrono = "0.4.38"
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
dirs-next = "2.0.0"
futures = "0.3.31"
napi = { version = "3.2.4", default-features = false, features = ["napi4", "async"] }
napi-derive = "3.2.4"
reqwest = { version = "0.12.5", features = ["blocking", "json", "stream", "gzip", "brotli", "deflate"] }
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9"
tokio = { version = "1.39.2", features = ["io-util", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
notify = "6"
regex = "1"
similar = "2"
tiktoken-rs = "0.6"
uuid = { version = "1", features = ["v4"] }
calamine = "0.36"
chardetng = "0.1"
csv = "1.4"
encoding_rs = "0.8"
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
oxc = { version = "0.82", features = ["semantic", "ast_visit"] }
oxc_miette = { package = "oxc-miette", version = "2.7" }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-json = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-lua = "0.5"

# Official MCP Rust SDK (2026-07-28 spec). Replaces hand-rolled JSON-RPC client.
rmcp = { version = "3.0.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# The `http` crate provides HeaderName / HeaderValue types used by rmcp's
# StreamableHttpClientTransportConfig::custom_headers API. It is already pulled
# in transitively by rmcp + reqwest, but we declare it explicitly so we can
# reference it directly in our code.
http = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
napi-build = "2.2.3"

# -- dev: reduce debug info (MSVC debug generation is very slow) --
[profile.dev]
debug = "line-tables-only"
incremental = true

# Dependencies are compiled once and cached; skip debug info + slight optimisation
[profile.dev.package."*"]
debug = false
opt-level = 1

# -- release: keep codegen-units high for parallel LLVM, thin LTO for link speed --
[profile.release]
lto = "thin"
codegen-units = 4
