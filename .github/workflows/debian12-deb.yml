name: Debian 12 DEB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian12-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          shared-key: debian12-x64

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test

  package-deb:
    name: Build Debian archive
    # Ubuntu 22.04's glibc 2.35 is compatible with Debian 12's glibc 2.36.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          shared-key: debian12-x64

      - name: Restore Electron packaging cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: debian12-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Restore Debian 12 image cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/debian-12-slim.tar
          key: debian12-image-${{ runner.os }}-amd64-v1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build application
        run: npm run build

      - name: Package Debian archive
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package_file"
          dpkg-deb --info "$package_file"
          dpkg-deb --contents "$package_file"

      - name: Install package on Debian 12
        shell: bash
        run: |
          set -euo pipefail
          image_archive="${RUNNER_TEMP}/debian-12-slim.tar"
          if [ -f "$image_archive" ]; then
            docker load --input "$image_archive"
          else
            for attempt in 1 2; do
              if timeout --foreground 90s docker pull debian:12-slim; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                exit 1
              fi
              sleep 10
            done
            docker save --output "$image_archive" debian:12-slim
          fi
          docker run --rm --pull=never -v "$PWD/release:/release:ro" debian:12-slim bash -ec '
            apt-get update
            apt-get install -y /release/*.deb
            package_name="$(dpkg-deb -f /release/*.deb Package)"
            dpkg-query -W -f="\${Status}\n" "$package_name" | grep -Fx "install ok installed"
          '

      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: snow-app-debian12-deb-candidate
          path: release/*.deb
          if-no-files-found: error
          retention-days: 1

  publish-deb:
    name: Publish verified Debian package
    needs: [test, package-deb]
    runs-on: ubuntu-22.04

    steps:
      - name: Download package candidate
        uses: actions/download-artifact@v4
        with:
          name: snow-app-debian12-deb-candidate
          path: release

      - name: Upload Debian 12 package
        uses: actions/upload-artifact@v4
        with:
          name: snow-app-debian12-deb
          path: release/*.deb
          if-no-files-found: error
