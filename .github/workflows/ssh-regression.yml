name: SSH regression

on:
  workflow_dispatch:
  push:
    paths:
      - "src/main/ssh/**"
      - "native/src/bin/snow-agent.rs"
      - "scripts/ssh-test-server/**"
      - ".github/workflows/ssh-regression.yml"

permissions:
  contents: read

concurrency:
  group: ssh-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openssh:
    name: OpenSSH on Debian ${{ matrix.debian }} (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "12"
            fixture: full
            install_tmux: "1"
            install_systemd_user: "0"
          - debian: "13"
            fixture: full
            install_tmux: "1"
            install_systemd_user: "0"
          - debian: "12"
            fixture: no-tmux
            install_tmux: "0"
            install_systemd_user: "0"
          - debian: "13"
            fixture: no-tmux
            install_tmux: "0"
            install_systemd_user: "0"
          - debian: "12"
            fixture: systemd-user
            install_tmux: "0"
            install_systemd_user: "1"
          - debian: "13"
            fixture: systemd-user
            install_tmux: "0"
            install_systemd_user: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build OpenSSH test server
        run: docker build --build-arg DEBIAN_SUITE=${{ matrix.debian }} --build-arg INSTALL_TMUX=${{ matrix.install_tmux }} --build-arg INSTALL_SYSTEMD_USER=${{ matrix.install_systemd_user }} --tag snow-ssh-test:${{ matrix.debian }}-${{ matrix.fixture }} scripts/ssh-test-server

      - name: Start OpenSSH test server and SSH agent
        shell: bash
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/snow-ssh-test"
          mkdir -p "$test_root/host-keys"
          ssh-keygen -q -t ed25519 -N '' -f "$test_root/id_ed25519"
          cp "$test_root/id_ed25519.pub" "$test_root/authorized_keys"
          ssh-keygen -q -t ed25519 -N '' -f "$test_root/host-keys/ssh_host_ed25519_key"
          eval "$(ssh-agent -s)"
          ssh-add "$test_root/id_ed25519"
          container_name="snow-ssh-test-${{ matrix.debian }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test_port=20222
          docker_options=()
          if [ "${{ matrix.fixture }}" = "systemd-user" ]; then
            docker_options+=(
              --privileged
              --cgroupns=host
              --tmpfs /run
              --tmpfs /run/lock
              --volume /sys/fs/cgroup:/sys/fs/cgroup:rw
            )
          fi
          docker run --detach --name "$container_name" "${docker_options[@]}" --publish 127.0.0.1:"$test_port":2222 \
            --volume "$test_root/host-keys:/host-keys" \
            --volume "$test_root/authorized_keys:/run/snow-authorized-keys:ro" \
            "snow-ssh-test:${{ matrix.debian }}-${{ matrix.fixture }}"
          test "$(docker inspect --format '{{.State.Running}}' "$container_name")" = "true"
          port="$test_port"
          ready=0
          for _ in $(seq 1 100); do
            if (echo > "/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = "1"
          {
            echo "SNOW_SSH_TEST=1"
            echo "SNOW_SSH_TEST_HOST=127.0.0.1"
            echo "SNOW_SSH_TEST_PORT=$port"
            echo "SNOW_SSH_TEST_CONTAINER=$container_name"
            echo "SNOW_SSH_TEST_HOST_KEY=$test_root/host-keys/ssh_host_ed25519_key"
            echo "SNOW_SSH_TEST_PRIVATE_KEY=$test_root/id_ed25519"
            echo "SNOW_SSH_TEST_FIXTURE=${{ matrix.fixture }}"
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
          } >> "$GITHUB_ENV"

      - name: Run SSH manager unit regression
        run: npx vitest run src/main/ssh/sshManager.test.ts

      - name: Run OpenSSH remote job regression
        # This suite must finish before the connection suite stops and restarts
        # the shared fault-injected server for host-key rotation.
        run: npx vitest run src/main/ssh/remoteJobs.openssh.test.ts

      - name: Run OpenSSH connection regression
        run: npx vitest run src/main/ssh/sshManager.openssh.test.ts

      - name: Collect OpenSSH logs on failure
        if: failure()
        run: docker logs "$SNOW_SSH_TEST_CONTAINER" || true

      - name: Remove OpenSSH test server
        if: always()
        run: docker rm --force "$SNOW_SSH_TEST_CONTAINER" || true

  windows-openssh:
    name: OpenSSH on Windows Server
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Start isolated Windows OpenSSH test server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH.Server*'
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name
          }
          $sshd = (Get-Command sshd.exe -ErrorAction Stop).Source
          $sshKeygen = (Get-Command ssh-keygen.exe -ErrorAction Stop).Source
          $testPort = 20222
          $testRoot = Join-Path $env:RUNNER_TEMP 'snow-windows-ssh-test'
          $config = Join-Path $testRoot 'sshd_config'
          $log = Join-Path $testRoot 'sshd.log'
          $taskName = "SnowAppSshRegression-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $password = ConvertTo-SecureString 'Violet!73North' -AsPlainText -Force
          if (-not (Get-LocalUser -Name snowssh -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name snowssh -Password $password -PasswordNeverExpires | Out-Null
          }
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          & $sshKeygen -A
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSH host-key generation failed with exit code $LASTEXITCODE"
          }
          $hostKeyPath = Join-Path $env:ProgramData 'ssh\ssh_host_ed25519_key'
          & icacls.exe $hostKeyPath /inheritance:r /setowner '*S-1-5-18' /grant:r '*S-1-5-18:(F)' '*S-1-5-32-544:(F)' | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to restrict OpenSSH host-key permissions with exit code $LASTEXITCODE"
          }
          $hostKey = $hostKeyPath.Replace('\', '/')
          $sftpServer = (Join-Path (Split-Path -Parent $sshd) 'sftp-server.exe').Replace('\', '/')
          @(
            "Port $testPort"
            'ListenAddress 127.0.0.1'
            "HostKey $hostKey"
            'PasswordAuthentication yes'
            "Subsystem sftp $sftpServer"
            'PermitRootLogin no'
            'LogLevel DEBUG3'
          ) | Set-Content -LiteralPath $config -Encoding ascii
          & $sshd -t -f $config
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSH configuration validation failed with exit code $LASTEXITCODE"
          }
          $taskCommand = "$sshd -D -f $config -E $log"
          $taskStartTime = (Get-Date).AddMinutes(2).ToString('HH:mm')
          & schtasks.exe /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $taskStartTime /RU SYSTEM /RL HIGHEST /F | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create isolated OpenSSH task with exit code $LASTEXITCODE"
          }
          & schtasks.exe /Run /TN $taskName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start isolated OpenSSH task with exit code $LASTEXITCODE"
          }
          $ready = $false
          for ($attempt = 0; $attempt -lt 50; $attempt++) {
            $probe = [System.Net.Sockets.TcpClient]::new()
            try {
              $probe.Connect('127.0.0.1', $testPort)
              $ready = $true
              break
            } catch {
              Start-Sleep -Milliseconds 200
            } finally {
              $probe.Dispose()
            }
          }
          if (-not $ready) {
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log
            }
            throw "Isolated OpenSSH test server did not listen on port $testPort"
          }
          @(
            'SNOW_WINDOWS_SSH_TEST=1'
            'SNOW_WINDOWS_SSH_TEST_HOST=127.0.0.1'
            "SNOW_WINDOWS_SSH_TEST_PORT=$testPort"
            'SNOW_WINDOWS_SSH_TEST_USER=snowssh'
            'SNOW_WINDOWS_SSH_TEST_PASSWORD=Violet!73North'
            "SNOW_WINDOWS_SSH_TEST_TASK=$taskName"
            "SNOW_WINDOWS_SSH_TEST_LOG=$log"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run Windows OpenSSH Remote Job regression
        shell: pwsh
        run: |
          npx vitest run src/main/ssh/remoteJobs.windows.openssh.test.ts src/main/ssh/windowsRemoteRunner.test.ts src/main/ssh/snowAgent.test.ts

      - name: Collect Windows OpenSSH logs on failure
        if: failure()
        shell: pwsh
        run: |
          if ($env:SNOW_WINDOWS_SSH_TEST_TASK) {
            & schtasks.exe /End /TN $env:SNOW_WINDOWS_SSH_TEST_TASK 2>$null
            Start-Sleep -Milliseconds 500
          }
          if ($env:SNOW_WINDOWS_SSH_TEST_LOG -and (Test-Path -LiteralPath $env:SNOW_WINDOWS_SSH_TEST_LOG)) {
            Get-Content -LiteralPath $env:SNOW_WINDOWS_SSH_TEST_LOG -ErrorAction Continue
          }

      - name: Stop isolated Windows OpenSSH test server
        if: always()
        shell: pwsh
        run: |
          if ($env:SNOW_WINDOWS_SSH_TEST_TASK) {
            & schtasks.exe /End /TN $env:SNOW_WINDOWS_SSH_TEST_TASK 2>$null
            & schtasks.exe /Delete /TN $env:SNOW_WINDOWS_SSH_TEST_TASK /F 2>$null
          }
